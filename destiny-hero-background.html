<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny Hero Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #heroCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            text-align: center;
            pointer-events: none;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3rem;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.4),
                         0 0 40px rgba(255, 100, 150, 0.3);
            opacity: 0.95;
        }
    </style>
</head>
<body>
    <canvas id="heroCanvas"></canvas>

    <div class="hero-content">
        <h1 class="hero-title">Destiny Awaits</h1>
    </div>

    <script>
        const canvas = document.getElementById('heroCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;
        const binaryColumns = [];

        // Resize canvas
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initBinaryRain();
        }

        // Binary Rain Configuration
        function initBinaryRain() {
            binaryColumns.length = 0;
            const columnCount = Math.floor(width / 18);

            for (let i = 0; i < columnCount; i++) {
                const posRatio = i / columnCount;
                let color;

                // Distribution des couleurs selon position
                if (posRatio < 0.4) {
                    color = 'cyan';
                } else if (posRatio > 0.6) {
                    color = 'red';
                } else {
                    color = Math.random() > 0.5 ? 'cyan' : 'red';
                }

                binaryColumns.push({
                    x: i * 18,
                    y: Math.random() * height * 2 - height,
                    speed: 0.5 + Math.random() * 1.2,
                    chars: [],
                    opacity: 0.15 + Math.random() * 0.35,
                    color: color
                });

                // Chaînes de binaires
                const chainLength = 25 + Math.floor(Math.random() * 20);
                for (let j = 0; j < chainLength; j++) {
                    binaryColumns[i].chars.push(Math.random() > 0.5 ? '1' : '0');
                }
            }
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Film Grain Effect
        function drawFilmGrain() {
            const grainDensity = 0.015;
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                if (Math.random() < grainDensity) {
                    const noise = Math.random() * 40;
                    data[i] = noise;
                    data[i + 1] = noise;
                    data[i + 2] = noise;
                    data[i + 3] = 25;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        // Orbs massives comme dans l'image
        function drawOrbs() {
            const maxDim = Math.max(width, height);

            // Orb BLEUE gauche - Énorme et diffuse
            const leftPulse = 0.88 + Math.sin(time * 0.0006) * 0.12;
            const leftRadius = maxDim * 1.2 * leftPulse;

            const leftGradient = ctx.createRadialGradient(
                width * 0.12, height * 0.5, 0,
                width * 0.12, height * 0.5, leftRadius
            );

            leftGradient.addColorStop(0, 'rgba(30, 140, 255, 0.65)');
            leftGradient.addColorStop(0.15, 'rgba(25, 120, 240, 0.50)');
            leftGradient.addColorStop(0.3, 'rgba(20, 100, 220, 0.35)');
            leftGradient.addColorStop(0.5, 'rgba(10, 70, 180, 0.18)');
            leftGradient.addColorStop(0.7, 'rgba(5, 40, 120, 0.06)');
            leftGradient.addColorStop(1, 'rgba(0, 20, 60, 0)');

            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = leftGradient;
            ctx.fillRect(0, 0, width, height);

            // Orb ROUGE droite - Énorme et diffuse
            const rightPulse = 0.88 + Math.sin(time * 0.0007 + Math.PI * 0.5) * 0.12;
            const rightRadius = maxDim * 1.25 * rightPulse;

            const rightGradient = ctx.createRadialGradient(
                width * 0.88, height * 0.5, 0,
                width * 0.88, height * 0.5, rightRadius
            );

            rightGradient.addColorStop(0, 'rgba(255, 40, 100, 0.65)');
            rightGradient.addColorStop(0.15, 'rgba(240, 30, 90, 0.50)');
            rightGradient.addColorStop(0.3, 'rgba(220, 20, 80, 0.35)');
            rightGradient.addColorStop(0.5, 'rgba(180, 10, 60, 0.18)');
            rightGradient.addColorStop(0.7, 'rgba(120, 5, 40, 0.06)');
            rightGradient.addColorStop(1, 'rgba(60, 0, 20, 0)');

            ctx.fillStyle = rightGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'source-over';
        }

        // Binary Rain
        function drawBinaryRain() {
            ctx.font = '11px "Courier New", monospace';
            ctx.globalAlpha = 1;

            for (let i = 0; i < binaryColumns.length; i++) {
                const col = binaryColumns[i];

                col.y += col.speed;
                if (col.y > height + 600) {
                    col.y = -600;
                    col.speed = 0.5 + Math.random() * 1.2;
                    col.opacity = 0.15 + Math.random() * 0.35;
                }

                // Mutation occasionnelle
                if (Math.random() > 0.97) {
                    const idx = Math.floor(Math.random() * col.chars.length);
                    col.chars[idx] = Math.random() > 0.5 ? '1' : '0';
                }

                // Dessiner la chaîne
                for (let j = 0; j < col.chars.length; j++) {
                    const y = col.y + j * 16;
                    if (y < -20 || y > height + 20) continue;

                    const fadeOut = 1 - (j / col.chars.length);
                    const finalOpacity = col.opacity * fadeOut * 0.7;

                    if (col.color === 'cyan') {
                        ctx.fillStyle = `rgba(80, 200, 255, ${finalOpacity})`;
                        if (j < 2) {
                            ctx.shadowBlur = 6;
                            ctx.shadowColor = 'rgba(80, 200, 255, 0.5)';
                        }
                    } else {
                        ctx.fillStyle = `rgba(255, 80, 150, ${finalOpacity})`;
                        if (j < 2) {
                            ctx.shadowBlur = 6;
                            ctx.shadowColor = 'rgba(255, 80, 150, 0.5)';
                        }
                    }

                    ctx.fillText(col.chars[j], col.x, y);

                    if (j < 2) {
                        ctx.shadowBlur = 0;
                    }
                }
            }

            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        // Animation Loop
        function animate() {
            // Fond noir profond
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Dessiner les couches
            drawOrbs();
            drawBinaryRain();
            drawFilmGrain();

            time++;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
